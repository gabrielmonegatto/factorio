# Teable enxuto — só o banco (sem Outline/legado). Migrado da Hostinger pra Hetzner.
# env_file aponta pro docker/.env (SO as vars do stack). O .env do repo NAO entra aqui:
# ele tem 83 credenciais da fabrica e o Teable so precisa de 7.
services:
  teable:
    image: ghcr.io/teableio/teable:latest
    container_name: factorio_teable
    restart: unless-stopped
    ports: ["3000:3000"]
    volumes: ["teable_data:/app/.assets:rw"]
    env_file: [".env"]
    environment:
      - TZ=America/Sao_Paulo
      - NEXT_ENV_IMAGES_ALL_REMOTE=true
      - BACKEND_CACHE_PROVIDER=redis
      - BACKEND_CACHE_REDIS_URI=redis://teable-cache:6379/0
    networks: ["factorio_network"]
    depends_on:
      teable-db-migrate:
        condition: service_completed_successfully
      teable-cache:
        condition: service_healthy

  teable-db-migrate:
    image: ghcr.io/teableio/teable-db-migrate:latest
    container_name: factorio_teable_db_migrate
    env_file: [".env"]
    environment: ["TZ=America/Sao_Paulo"]
    networks: ["factorio_network"]
    depends_on:
      teable-db:
        condition: service_healthy

  teable-db:
    image: postgres:15-alpine
    container_name: factorio_teable_db
    restart: unless-stopped
    ports: ["42345:5432"]
    environment:
      POSTGRES_DB: ${TEABLE_POSTGRES_DB}
      POSTGRES_USER: ${TEABLE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEABLE_POSTGRES_PASSWORD}
    volumes: ["teable_db_data:/var/lib/postgresql/data"]
    networks: ["factorio_network"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEABLE_POSTGRES_USER} -d ${TEABLE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  teable-cache:
    image: redis:7-alpine
    container_name: factorio_teable_cache
    restart: unless-stopped
    networks: ["factorio_network"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  reverse-proxy:
    image: caddy:2-alpine
    container_name: factorio_proxy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile.teable:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks: ["factorio_network"]
    depends_on: ["teable"]

networks:
  factorio_network:
    name: factorio_network

volumes:
  teable_data:
  teable_db_data:
  caddy_data:
  caddy_config:
