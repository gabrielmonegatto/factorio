# --- FACTORIO CORE: INTELLIGENCE & ORCHESTRATION ---
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: factorio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eternall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - factorio_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: factorio_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - factorio_network

  factorio_agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: factorio_agents
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BASEROW_URL=http://factorio_baserow
      - BASEROW_TABLE_OPERATIONS=623
    ports:
      - "8001:8001"
    volumes:
      - ./agents:/app
      - ../:/factory
    networks:
      - factorio_network

  mcp_universal:
    build:
      context: ./mcp_universal
      dockerfile: Dockerfile
    container_name: factorio_mcp_universal
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3111:3111"
    volumes:
      - mcp_data:/app/data
    networks:
      - factorio_network
    depends_on:
      - baserow

  baserow:
    image: baserow/baserow:latest
    container_name: factorio_baserow
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Database - Conecta no PostgreSQL existente no cluster
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/baserow_app"
      
      # Redis - Usa o Redis existente
      BASEROW_REDIS_HOST: "redis"
      BASEROW_REDIS_PORT: "6379"
      BASEROW_REDIS_DATABASE: "1"
      
      # Configuração básica
      BASEROW_PUBLIC_URL: "http://factorio.io"
      BASEROW_TRUST_PROXY: "1"
      BASEROW_ENABLE_TEMPLATES: "true"
      BASEROW_EMBEDDED_TEMPLATES: "true"
      
      # Habilita webhooks
      BASEROW_WEBHOOKS_ENABLED: "true"
      
      # Modo single-user otimizado (sem Elasticsearch)
      BASEROW_SEARCH_ENGINE: "postgres"
      BASEROW_FILE_UPLOAD_STORAGE: "local"
      
      # Previne sincronização de templates pesados no início
      BASEROW_TRIGGER_SYNC_TEMPLATES_AFTER_MIGRATION: "false"
      
      # Token JWT
      BASEROW_JWT_SIGNING_KEY: "${BASEROW_JWT_KEY:-baserow_factorio_secret_key}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - baserow_data:/baserow/data
    networks:
      - factorio_network

  reverse-proxy:
    image: caddy:2-alpine
    container_name: factorio_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - factorio_network
    depends_on:
      - baserow
      - teable

  nocodb:
    image: nocodb/nocodb:0.202.9
    container_name: factorio_nocodb
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
    volumes:
      - nocodb_data:/usr/app/data
    networks:
      - factorio_network
    depends_on:
      postgres:
        condition: service_healthy

  teable:
    image: ghcr.io/teableio/teable:latest
    container_name: factorio_teable
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - teable_data:/app/.assets:rw
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-America/Sao_Paulo}
      - NEXT_ENV_IMAGES_ALL_REMOTE=true
      - BACKEND_CACHE_PROVIDER=redis
      - BACKEND_CACHE_REDIS_URI=redis://teable-cache:6379/0
    networks:
      - factorio_network
    depends_on:
      teable-db-migrate:
        condition: service_completed_successfully
      teable-cache:
        condition: service_healthy

  teable-db-migrate:
    image: ghcr.io/teableio/teable-db-migrate:latest
    container_name: factorio_teable_db_migrate
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-America/Sao_Paulo}
    networks:
      - factorio_network
    depends_on:
      teable-db:
        condition: service_healthy

  teable-db:
    image: postgres:15-alpine
    container_name: factorio_teable_db
    restart: unless-stopped
    ports:
      - "42345:5432"
    environment:
      POSTGRES_DB: ${TEABLE_POSTGRES_DB}
      POSTGRES_USER: ${TEABLE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEABLE_POSTGRES_PASSWORD}
    volumes:
      - teable_db_data:/var/lib/postgresql/data
    networks:
      - factorio_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEABLE_POSTGRES_USER} -d ${TEABLE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  teable-cache:
    image: redis:7-alpine
    container_name: factorio_teable_cache
    restart: unless-stopped
    networks:
      - factorio_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  factorio_network:
    external: true

volumes:
  postgres_data:
    name: factorio_postgres_data
  baserow_data:
    name: factorio_baserow_data
  mcp_data:
    name: factorio_mcp_data
  nocodb_data:
    name: factorio_nocodb_data
  teable_data:
    name: factorio_teable_data
  teable_db_data:
    name: factorio_teable_db_data
  caddy_data:
    name: factorio_caddy_data
  caddy_config:
    name: factorio_caddy_config
